name: Linux Hybrid - smoke tests
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar instalador multidistro (sem alterar sistema)
        run: bash tests/smoke.sh
      - name: Validar perfis KDE (ambiente isolado)
        run: bash tests/perfis-kde-smoke.sh
